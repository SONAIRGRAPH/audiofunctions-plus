<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiofunctions+</title>
    <!--
      Applies the display preferences before the first paint, otherwise the
      light default theme flashes up on reload. Has to stay in sync with
      src/utils/prefs.js and src/utils/theme.js, and is deliberately kept small
      and free of module imports so it runs blocking.

      It knows nothing about the values a theme suggests, and does not need to:
      'auto' goes into the attribute as is, and the cascade in theme.css picks
      the theme's value. Only the themes that follow the OS light/dark setting
      are resolved here (FOLLOWS, the `follows` field in theme.js), because a
      theme cannot suggest itself.
    -->
    <script>
      (function () {
        // Theme id -> [light, dark]; must match `follows` in src/utils/theme.js
        var FOLLOWS = {
          'system': ['light', 'dark'],
          'high-contrast-system': ['high-contrast-light', 'high-contrast'],
          'deuteranopia-protanopia-friendly-system': ['deuteranopia-protanopia-friendly', 'deuteranopia-protanopia-friendly-dark'],
          'low-glare-system': ['low-glare-light', 'low-glare'],
          'sepia-system': ['sepia', 'sepia-dark'],
          'monochrome-system': ['monochrome-light', 'monochrome-dark']
        };
        var prefs = [
          {
            key: 'theme',
            attr: 'data-theme',
            values: [
              'system', 'light', 'dark',
              'high-contrast-system', 'high-contrast-light', 'high-contrast',
              'deuteranopia-protanopia-friendly-system', 'deuteranopia-protanopia-friendly', 'deuteranopia-protanopia-friendly-dark',
              'low-glare-system', 'low-glare-light', 'low-glare',
              'sepia-system', 'sepia', 'sepia-dark',
              'monochrome-system', 'monochrome-light', 'monochrome-dark',
              'high-contrast-yellow', 'high-contrast-navy'
            ],
            fallback: 'system'
          },
          { key: 'lineWidth', attr: 'data-line-width', values: ['auto', 'thin', 'normal', 'thick', 'x-thick'], fallback: 'auto' },
          { key: 'textSize', attr: 'data-text-size', values: ['auto', 'sm', 'normal', 'lg', 'xl'], fallback: 'auto' },
          { key: 'font', attr: 'data-font', values: ['auto', 'system', 'inter', 'atkinson', 'lexend', 'andika', 'comic-neue', 'opendyslexic'], fallback: 'auto' },
          { key: 'spacing', attr: 'data-spacing', values: ['auto', 'normal', 'wide'], fallback: 'auto' }
        ];
        for (var i = 0; i < prefs.length; i++) {
          var pref = prefs[i];
          var value = pref.fallback;
          try {
            var stored = localStorage.getItem(pref.key);
            if (pref.values.indexOf(stored) !== -1) value = stored;
          } catch (e) {
            /* localStorage blocked -- the fallback is good enough */
          }
          if (pref.key === 'theme' && FOLLOWS[value]) {
            value = FOLLOWS[value][window.matchMedia('(prefers-color-scheme: dark)').matches ? 1 : 0];
          }
          document.documentElement.setAttribute(pref.attr, value);
        }
      })();
    </script>
    <!-- Matomo -->
    <script>
      var _paq = window._paq = window._paq || [];
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="https://audiofunctionsmonitor.accesee.it/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '1']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Code -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
