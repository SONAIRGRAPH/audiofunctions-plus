<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Audiofunctions+</title>
    <!--
      Applies the display preferences before the first paint, otherwise the
      light default theme flashes up on reload. Has to stay in sync with
      src/utils/prefs.js and src/utils/theme.js, and is deliberately kept small
      and free of module imports so it runs blocking.
    -->
    <script>
      (function () {
        var prefs = [
          {
            key: 'theme',
            attr: 'data-theme',
            values: ['system', 'light', 'dark', 'high-contrast', 'deuteranopia-protanopia-friendly'],
            fallback: 'system'
          },
          { key: 'lineWidth', attr: 'data-line-width', values: ['thin', 'normal', 'thick', 'x-thick'], fallback: 'normal' },
          { key: 'textSize', attr: 'data-text-size', values: ['sm', 'normal', 'lg', 'xl'], fallback: 'normal' }
        ];
        for (var i = 0; i < prefs.length; i++) {
          var pref = prefs[i];
          var value = pref.fallback;
          try {
            var stored = localStorage.getItem(pref.key);
            if (pref.values.indexOf(stored) !== -1) value = stored;
          } catch (e) {
            /* localStorage blocked -- the fallback is good enough */
          }
          if (pref.key === 'theme' && value === 'system') {
            value = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute(pref.attr, value);
        }
      })();
    </script>
    <!-- Matomo -->
    <script>
      var _paq = window._paq = window._paq || [];
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="https://audiofunctionsmonitor.accesee.it/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '1']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src=u+'matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Code -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
